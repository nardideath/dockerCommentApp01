services:

  app:
    build:
      context: ./app
      dockerfile: ../Dockerfile
    
    container_name: dockerCommentApp
    
    depends_on:
      - db

    environment:
      DB_HOST: db
      DB_NAME: testdb
      DB_USER: user
      DB_PASSWORD: password

    volumes:
      - ./app_data:/storage

    networks:
      - my_network

    command: python main.py


  db:
    image: postgres:15
    container_name: dockerCommentDB

    restart: always

    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password

#    ports:
#      - "5432:5432"
#
#    volumes:
#      - ./db_data:/var/lib/postgresql/data

    networks:
      - my_network

networks:
  my_network:
  
  
